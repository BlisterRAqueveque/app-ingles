<ion-content class="login-page" fullscreen>
  <div class="login-wrapper">
    <ion-card class="login-card">
      <div class="logo-wrap flex justify-center items-center">
        @if (logoUrl) {
        <img [src]="logoUrl" alt="Logo" />
        } @else {
        <div class="logo-placeholder">LOGO</div>
        }
      </div>

      <ion-card-content>
        <h2 class="title">Bienvenido</h2>

        <div class="p-field mb-4">
          <label for="username" class="sr-only">Usuario</label>
          <input
            id="username"
            pInputText
            type="text"
            placeholder="Usuario"
            [(ngModel)]="username"
          />
        </div>

        <div class="p-field relative mb-4">
          <label for="password" class="sr-only">Contraseña</label>
          <input
            id="password"
            pInputText
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Contraseña"
            [(ngModel)]="password"
          />
          <ion-icon
            (click)="showPassword = !showPassword"
            [name]="showPassword ? 'eye-outline' : 'eye-off-outline'"
            class="absolute right-2 text-2xl text-green-900 top-1/2 -translate-y-1/2"
          ></ion-icon>
        </div>

        <div class="actions">
          <button
            pButton
            type="submit"
            label="Ingresar"
            class="full"
            (click)="login()"
          ></button>
        </div>

        <div class="links">
          <a class="small-link">¿Olvidaste tu contraseña?</a>
        </div>
      </ion-card-content>

      <ion-footer class="footer-note">
        <small>App demo • Ministerio de educación</small>
      </ion-footer>
    </ion-card>
  </div>
</ion-content>

<p-confirmdialog />
